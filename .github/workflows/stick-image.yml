# Builds the NexWipe stick image (read-only station) on a GitHub Linux machine.
# Result: Actions run page -> Artifacts -> nexwipe-stick-<commit>. Contains the .img.xz to write with balenaEtcher/Rufus.
# The image has no erase tools: build.sh runs verify-image.sh and fails the build if any are found.
name: Build NexWipe stick image

on:
  workflow_dispatch:
  push:
    paths:
      - agent-handoff/station/**
      - agent-handoff/usb-image/**
      - .github/workflows/stick-image.yml

permissions:
  contents: read

env:
  STICK_UPLOAD_TOKEN: ${{ secrets.STICK_UPLOAD_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Station program tests
        working-directory: agent-handoff/station
        run: python3 -m unittest discover -s tests

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends debootstrap debian-archive-keyring \
            squashfs-tools gdisk dosfstools mtools e2fsprogs xxd xz-utils

      - name: Build image (includes the no-erase-tools check)
        run: sudo ./agent-handoff/usb-image/build.sh

      - name: Compress and fingerprint
        working-directory: agent-handoff/usb-image/build
        run: |
          sudo xz -T0 -6 -k ./*.img
          sudo sh -c 'sha256sum ./*.img.xz > image-xz.sha256'
          cat ./*.sha256 components.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: nexwipe-stick-${{ github.sha }}
          retention-days: 30
          compression-level: 0
          path: |
            agent-handoff/usb-image/build/*.img.xz
            agent-handoff/usb-image/build/*.sha256
            agent-handoff/usb-image/build/installed-packages.txt

      # Upload to the app's private storage (bucket artifacts, folder stick-image/) through our own upload door.
      # Only main builds, and only when the STICK_UPLOAD_TOKEN secret is set. The build becomes the one offered by
      # "Download stick image" only after the separate "Promote NexWipe stick image" workflow is run for it.
      - name: Upload to NexWipe storage (candidate)
        if: github.ref == 'refs/heads/main' && env.STICK_UPLOAD_TOKEN != ''
        env:
          STICK_UPLOAD_TOKEN: ${{ secrets.STICK_UPLOAD_TOKEN }}
          NEXWIPE_URL: https://nexwipe.co
        working-directory: agent-handoff/usb-image/build
        run: |
          set -euo pipefail
          IMG=$(ls ./*.img.xz | head -1)
          VERSION="$(basename "$IMG" .img.xz | sed 's/^nexwipe-station-readonly-//')-${GITHUB_SHA::7}"
          mkdir -p parts && split -b 32M -d -a 3 "$IMG" parts/part-
          python3 - "$IMG" "$VERSION" > parts/manifest.json <<'PY'
          import hashlib, json, os, sys
          img, version = sys.argv[1], sys.argv[2]
          h = lambda p: hashlib.sha256(open(p, "rb").read()).hexdigest()
          parts = sorted(n for n in os.listdir("parts") if n.startswith("part-"))
          print(json.dumps({"version": version, "file": f"nexwipe-stick-{version}.img.xz", "size": os.path.getsize(img),
                            "sha256": h(img), "parts": [{"name": n, "size": os.path.getsize(f"parts/{n}"),
                            "sha256": h(f"parts/{n}")} for n in parts]}))
          PY
          for f in parts/part-* parts/manifest.json; do
            curl -sS --fail-with-body --retry 3 --retry-all-errors -X PUT -H "authorization: Bearer $STICK_UPLOAD_TOKEN" \
              --data-binary "@$f" "$NEXWIPE_URL/api/public/stick-image/upload/$VERSION/$(basename "$f")"; echo
          done
          echo "Uploaded candidate $VERSION. To offer it in Prepare USB stick: Actions -> Promote NexWipe stick image -> Run workflow -> $VERSION" >> "$GITHUB_STEP_SUMMARY"
