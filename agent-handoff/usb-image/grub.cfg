set timeout=3
set default=0
insmod part_gpt
insmod fat
# Find the stick by a marker file, not the volume name: a technician may rename the drive in Windows.
search --no-floppy --set=root --file /.disk/nexwipe-stick

# toram: the system is copied into memory, so pulling the stick does not stop a running session.
menuentry "NexWipe station (READ-ONLY test build - no erasure)" {
    linux /live/vmlinuz boot=live live-media-path=/live components toram quiet loglevel=3 nopersistence noeject nofstab console=tty1 systemd.show_status=0 vt.global_cursor_default=0
    initrd /live/initrd.img
}

# Runs from the stick (no toram): use on laptops with little memory.
menuentry "NexWipe station - diagnostics (runs from the stick, verbose boot, serial console)" {
    linux /live/vmlinuz boot=live live-media-path=/live components nopersistence noeject nofstab console=ttyS0,115200 console=tty1
    initrd /live/initrd.img
}
